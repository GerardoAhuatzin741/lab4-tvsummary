[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvsummary"
version = "1.0.0"
description = "Summarize TV shows from the TVmaze public API into a JSON report."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gerardo Ahuatzin Galicia" }]
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff", "types-requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvsummary = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
